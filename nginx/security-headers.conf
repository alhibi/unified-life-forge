# Security headers, defined once and `include`d by every location block.
#
# WHY A SEPARATE FILE
#
# nginx's `add_header` does not inherit: the moment a `location` adds a header of
# its own — and every location here adds `Cache-Control` — it loses every header
# set by the enclosing `server` block. nginx.conf handled that correctly, by
# repeating the whole set in each block, which meant the Content-Security-Policy
# was written out three times verbatim. A CSP that has to be edited in three places
# is a CSP that will end up different in three places, and the one on the
# `try_files` fallback — the path that serves index.html for every route — is the
# one that matters most.
#
# `include` gives nginx the same repetition without asking a human to perform it.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), interest-cohort=()" always;

# X-XSS-Protection is deliberately absent. It controlled the XSS Auditor in
# legacy WebKit/Blink, which every current browser has removed; Chrome dropped it
# in 78 because the filter itself introduced information-disclosure bugs. Sending
# it advertises a control that does nothing. The CSP below is the real one.

# ── Content Security Policy ─────────────────────────────────────────────────
#
# connect-src enumerates the app's real backends: Supabase (REST + realtime
# websockets), Open-Meteo for weather, alquran.cloud and islamic.network for
# Quran text and audio, OpenFreeMap for map tiles.
#
# KNOWN WEAKNESSES, stated rather than left to be discovered:
#
#   • `script-src 'unsafe-inline' 'unsafe-eval'`. This is the significant gap —
#     with both present, CSP stops very little script injection, which matters
#     because five components render third-party RSS/article HTML through
#     `dangerouslySetInnerHTML`. `src/utils/sanitizeRssHtml.ts` is what actually
#     defends those (32 tests in its suite); CSP is not currently a second layer
#     for them.
#
#     Removing them needs a build change, not a config change: Vite emits no
#     inline scripts for this app, but a nonce or hash has to be threaded through
#     index.html, and `unsafe-eval` has to be proven unnecessary at runtime
#     (source-map consumers and some WASM/worker paths use it). Doing it blind
#     would produce a white screen in production, so it is left as-is and
#     documented here.
#
#   • `style-src 'unsafe-inline'` is required: the theming engine writes CSS
#     custom properties onto `document.documentElement` at runtime, and every
#     framer-motion animation sets inline styles. This one is not removable
#     without rewriting the design system.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co https://*.supabase.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://*.tile.openstreetmap.org https://tiles.openfreemap.org https://images.unsplash.com; connect-src 'self' https://tiles.openfreemap.org https://*.supabase.co https://*.supabase.net https://api.alquran.cloud https://open-meteo.com wss://*.supabase.co wss://*.supabase.net https://audio.qurancdn.com https://cdn.islamic.network; media-src 'self' blob: https://*.supabase.co https://audio.qurancdn.com; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
