# High-Performance, Secure Nginx Configuration for SmartHub SPA

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging settings
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # Basic Optimization Settings
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off; # Hide Nginx version for security

    # Temp paths for non-root execution support
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Gzip Compression Settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        image/x-icon;

    server {
        listen       8080 default_server;
        listen       [::]:8080 default_server;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # Security headers live in nginx/security-headers.conf and are `include`d by
        # every location block below. nginx's `add_header` does not inherit — a
        # location that sets any header of its own drops everything the server block
        # set — so the whole set genuinely has to be repeated per location. It was,
        # by hand, which meant the Content-Security-Policy was written out three
        # times verbatim. `include` keeps the repetition and removes the drift.
        include /etc/nginx/security-headers.conf;

        # SPA Routing
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            include /etc/nginx/security-headers.conf;
        }

        # ── Source maps: never served ──────────────────────────────────────
        # The build emits `sourcemap: 'hidden'` maps so Sentry can symbolicate
        # stack traces. CI deletes them from dist/ after uploading, but a build
        # without Sentry credentials leaves them in place, and a .map is a
        # complete copy of the original source. Deny them here so that whether
        # the upload ran is not the thing standing between the source and the
        # internet. Must precede the static-asset regex block below.
        location ~* \.map$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ── Service worker: never cache ─────────────────────────────────────
        # /sw.js is NOT fingerprinted, so the immutable 1-year policy below
        # would have pinned it forever and no update could ever reach a
        # returning visitor. An exact-match `location =` outranks the regex
        # blocks that follow, so this has to stay above them.
        location = /sw.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Service-Worker-Allowed "/" always;
            access_log off;
            include /etc/nginx/security-headers.conf;
        }

        # Cache Policy for Compiled Assets (Vite produces hash-based filenames)
        location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpe?g|gif|ico|svg|webp|webm|mp4|mp3)$ {
            # `expires 1y` is deliberately absent. It emits its own Cache-Control,
            # so having both sent two of them on every asset:
            #   Cache-Control: max-age=31536000
            #   Cache-Control: public, max-age=31536000, immutable
            # Duplicate Cache-Control is ambiguous — the `immutable` hint that stops
            # revalidation on reload is in the second one, and which a given browser
            # or CDN honours is not something to leave to chance. The explicit header
            # says strictly more, so it is the one that stays.
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
            log_not_found off;
            include /etc/nginx/security-headers.conf;
        }

        # Cache Policy for config / metadata files
        location ~* \.(?:json|xml|txt|webmanifest)$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            include /etc/nginx/security-headers.conf;
        }

        # Custom Error Pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
