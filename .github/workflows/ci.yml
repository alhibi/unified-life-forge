name: CI

# The repo had no CI at all. Nothing enforced the lint gate, which is how it
# reached 912 lint errors with a permanently red `bun run verify`. This is the
# ratchet that keeps it from happening again.

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer re-run the gate without pushing an empty commit.
  workflow_dispatch:

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, budget, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version the lockfile was produced with. A floating
          # "latest" would let a Bun release change resolution without any
          # commit in this repo.
          bun-version: 1.2.14

      # lint-budget.mjs shells out to bunx eslint but is itself run by node,
      # matching the `node scripts/lint-budget.mjs` entry in package.json.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # --frozen-lockfile fails if bun.lock disagrees with package.json,
        # so a dependency added without committing the lockfile is caught here
        # rather than at the next person's install.
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (must be 0 errors)
        run: bun run lint

      - name: Lint budget (budgeted warnings must not increase)
        run: bun run lint:budget

      - name: Icon registries match the manifest
        # src/lib/icons/registry.*.ts and the export list in src/lib/icons.tsx are
        # generated from ICON_NAMES. They are committed so the build never depends
        # on the generator, which means they can be edited by hand or left stale
        # after a manifest change. Regenerating and diffing is the only way to know.
        #
        # registry.test.ts already checks manifest ↔ registry ↔ exports agree; this
        # additionally catches an edit that is self-consistent but not what the
        # generator would produce.
        run: |
          bun run icons:generate
          if ! git diff --quiet -- src/lib/icons.tsx src/lib/icons; then
            echo "::error::Generated icon files are out of date. Run 'bun run icons:generate' and commit."
            git --no-pager diff --stat -- src/lib/icons.tsx src/lib/icons
            exit 1
          fi
          echo "Icon registries are up to date."

      - name: Unit tests with coverage thresholds
        # Coverage is a ratchet with floors set from a measured run (see the note in
        # vitest.config.ts about why they are low rather than aspirational). Istanbul,
        # not v8: @vitest/coverage-v8 needs node:inspector, which Bun does not have.
        run: bun run test:coverage

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        # No Supabase env vars on purpose. src/integrations/supabase/client.ts
        # falls back to placeholders and the app degrades to local-only mode,
        # so this also proves the build does not depend on secrets.
        run: bun run build

      - name: Check the service worker was emitted
        # The app-shell worker is generated by a Vite plugin in writeBundle.
        # A silent failure there would ship a PWA that promises offline
        # support and does not have it, which is exactly the bug the plugin
        # was written to fix.
        run: |
          test -f dist/sw.js || { echo "dist/sw.js missing"; exit 1; }
          grep -q "PRECACHE" dist/sw.js || { echo "sw.js has no precache manifest"; exit 1; }
          echo "sw.js present ($(wc -c < dist/sw.js) bytes)"

      - name: Service-worker assertions (need dist/)
        # build/__tests__/appShellServiceWorker.test.ts is `describe.runIf(hasBuild)`
        # so that `bun run test` works on a clean checkout. The consequence was
        # that its 7 assertions ran on no machine at all: the `verify` job has no
        # dist/, and this job never ran the tests. The grep above only proves the
        # word PRECACHE appears somewhere — these check the manifest actually
        # covers every asset index.html loads up front.
        run: bun run test build/__tests__/appShellServiceWorker.test.ts

      - name: First-paint bundle budget
        # This step used to only *print* the largest chunks. Printing is not gating:
        # the entry chunk reached 11 MB raw / 1.97 MB gzipped behind a blocking
        # <script> — 96% of it icon data from four libraries — and the number was in
        # the log on every single run.
        #
        # It now fails the build. It measures only what a first-time visitor must
        # download before anything renders (entry script + stylesheet + every
        # modulepreload in index.html); lazy route chunks are excluded, because
        # deferring them is the whole point of the code splitting.
        run: |
          # Deliberately not `bun run bundle:budget | tee`. GitHub runs steps with
          # `bash -e`, not `-o pipefail`, so a pipeline exits with the status of the
          # LAST command — `tee` always succeeds, and the gate would silently never
          # fail. Capture first, then re-raise the real exit code.
          set -o pipefail
          bun run bundle:budget | tee budget.txt
          status=$?
          {
            echo '### First-paint bundle budget'
            echo '```'
            cat budget.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f budget.txt
          exit $status

      - name: Report all chunk sizes
        # Still useful in review, but no longer the only thing between a size
        # regression and production.
        if: always()
        run: |
          {
            echo '### All chunks'
            echo '```'
            ls -S dist/assets/*.js | head -15 | while read -r f; do
              printf '%8s KB  %s\n' "$(( $(wc -c < "$f") / 1024 ))" "$(basename "$f")"
            done
            echo "Total JS: $(( $(cat dist/assets/*.js | wc -c) / 1024 )) KB"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the Chromium browser
        # Only chromium: both Playwright projects use it (desktop + Pixel 7
        # emulation), so pulling Firefox and WebKit would triple the download
        # for no extra coverage.
        run: bunx playwright install --with-deps chromium

      - name: Run the suite
        # playwright.config.ts builds the app and serves it with vite preview
        # via its webServer block. No Supabase env vars, so this also covers
        # the local-only / signed-out paths a first-time visitor lands on.
        run: bun run e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
