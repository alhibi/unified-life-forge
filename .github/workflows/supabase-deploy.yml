# Ships Supabase changes automatically whenever they land on main.
#
# Any agent (or human) that pushes migrations or edge-function changes to
# main triggers this: pending migrations are applied and all declared edge
# functions are redeployed. No manual dashboard step, ever, once these two
# repository secrets exist:
#
#   SUPABASE_ACCESS_TOKEN  — Supabase → Account → Access Tokens
#   SUPABASE_DB_PASSWORD   — the project's database password
#
# Idempotent by design: `db push` applies only what is pending, and
# functions deploy simply overwrites with the newest bundle.

name: Supabase Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push pending database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN غير مضبوط — أضفه من إعدادات المستودع"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secret SUPABASE_DB_PASSWORD غير مضبوط — أضفه من إعدادات المستودع"
            exit 1
          fi
          supabase db push --linked --db-password "$SUPABASE_DB_PASSWORD"

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy atlas-scout --linked
