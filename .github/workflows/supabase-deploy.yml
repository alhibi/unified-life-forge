# Ships Supabase changes automatically whenever they land on main.
#
# Any agent (or human) that pushes migrations or edge-function changes to
# main triggers this: pending migrations are applied through the Management
# API (scripts/supabase-migrate-remote.py — no DB password involved) and all
# declared edge functions are redeployed. The only repository secret needed:
#
#   SUPABASE_ACCESS_TOKEN  — from the Supabase account that OWNS the project
#
# Idempotent by design: applied versions are tracked remotely and skipped,
# functions deploy simply overwrites with the newest bundle.

name: Supabase Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-deploy.yml'
      - 'scripts/supabase-migrate-remote.py'
  workflow_dispatch: {}

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply pending database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN غير مضبوط — أضفه من إعدادات المستودع"
            exit 1
          fi
          # Resolves the project ref from supabase/.temp/linked-project.json.
          python3 scripts/supabase-migrate-remote.py

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy atlas-scout --linked
