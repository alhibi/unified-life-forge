    <!-- ── Web fonts ───────────────────────────────────────────────────
         This used to be THREE stylesheet requests covering nine families
         (Inter, Noto Sans Arabic, Cormorant Garamond and Amiri were each
         requested more than once, and Cormorant was ALSO self-hosted via
         @fontsource in main.tsx).

         Now: one request, and only the families the app can actually
         select — see src/lib/fonts.ts, which is the single source of
         truth for the font picker. Weights are limited to 400–700
         because the weight slider no longer offers 300.
           • IBM Plex Sans Arabic — default UI face
           • Cairo / Tajawal / Readex Pro — alternative UI faces
           • Amiri — Quran / poetry serif
           • IBM Plex Mono — tabular numerals (clock, tables)
         Cormorant Garamond + Montserrat stay self-hosted in main.tsx. -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />
    <script>
      (function () {
        try {
          const cachedTokens = localStorage.getItem('app-root-tokens-v1');
          if (cachedTokens) {
            const parsed = JSON.parse(cachedTokens);
            const prototype =
              parsed && typeof parsed === 'object' ? Object.getPrototypeOf(parsed) : null;
            const isPlainObject =
              parsed !== null &&
              typeof parsed === 'object' &&
              !Array.isArray(parsed) &&
              (prototype === Object.prototype || prototype === null);

            if (isPlainObject) {
              Object.entries(parsed)
                .slice(0, 256)
                .forEach(([key, value]) => {
                  if (
                    key.startsWith('--') &&
                    key.length >= 3 &&
                    key.length <= 128 &&
                    typeof value === 'string' &&
                    value.length <= 1024
                  ) {
                    document.documentElement.style.setProperty(key, value);
                  }
                });
            }
          }
        } catch {
          // Ignore an unavailable or malformed token cache and continue booting.
        }

        try {
          const theme = localStorage.getItem('app-theme') || 'light';
          const isDark = theme === 'dark';
          document.documentElement.classList.toggle('dark', isDark);

          const lang = localStorage.getItem('app-language') || 'ar';
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
          document.documentElement.lang = lang;

          // Prevent layout shift by setting correct design mode
          document.documentElement.removeAttribute('data-md3');
          document.documentElement.setAttribute('data-design-mode', 'classic');
        } catch {
          // Storage failures fall back to stylesheet and document defaults.
        }
      })();
    </script>
