# RSS fetching is harmless (public feeds, SSRF-filtered URLs). We accept
# anonymous callers so guests can refresh feeds; the handler still
# requires a valid user for `store=true` writes.
[functions.fetch-rss]
verify_jwt = false

# Archive search reads from `rss_articles` which is publicly readable
# (RLS policy "Anyone can read articles" + RPC granted to anon). The
# handler resolves session info opportunistically via `optionalUser`
# rather than rejecting unsigned-in browsers.
[functions.search-articles]
verify_jwt = false
